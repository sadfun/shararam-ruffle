name: Release builds

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Run release checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --no-default-features --features desktop -- -D warnings

  build:
    name: ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: windows-x86_64
            runner: windows-2025
            os: windows
            target: x86_64-pc-windows-msvc
            bundle_args: --no-bundle
            upload_plain_binary: true
            signing_identity: ""
          - asset: windows-arm64
            runner: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
            bundle_args: --no-bundle
            upload_plain_binary: true
            signing_identity: ""
          - asset: macos-x86_64
            runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            bundle_args: --bundles app
            upload_plain_binary: false
            signing_identity: "-"
          - asset: macos-arm64
            runner: macos-15
            os: macos
            target: aarch64-apple-darwin
            bundle_args: --bundles app
            upload_plain_binary: false
            signing_identity: "-"
          - asset: linux-x86_64
            runner: ubuntu-22.04
            os: linux
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles appimage
            upload_plain_binary: false
            signing_identity: ""
          - asset: linux-arm64
            runner: ubuntu-22.04-arm
            os: linux
            target: aarch64-unknown-linux-gnu
            bundle_args: --bundles appimage
            upload_plain_binary: false
            signing_identity: ""

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Select stable Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'

      - name: Configure LLVM on Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          llvm_config="$(command -v llvm-config || command -v llvm-config-14)"
          echo "LIBCLANG_PATH=$($llvm_config --libdir)" >> "$GITHUB_ENV"

      - name: Configure LLVM on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm@18)/lib" >> "$GITHUB_ENV"

      - name: Configure native Windows build
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $clang = Get-Command clang.exe -ErrorAction SilentlyContinue
          $llvmDirectory = if ($clang) { Split-Path $clang.Source } else { $null }
          if (-not $llvmDirectory -or -not (Test-Path (Join-Path $llvmDirectory 'libclang.dll'))) {
            $libclang = Get-ChildItem -Path $env:ProgramFiles -Filter libclang.dll -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $libclang) {
              throw 'Unable to locate libclang.dll on the Windows runner'
            }
            $llvmDirectory = $libclang.DirectoryName
          }
          "LIBCLANG_PATH=$llvmDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\src-tauri\cmake\windows-no-asm.cmake" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache Cargo inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build and upload portable desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          projectPath: src-tauri
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseDraft: false
          retryAttempts: 1
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadPlainBinary: ${{ matrix.upload_plain_binary }}
          releaseAssetNamePattern: Shararam-Ruffle-[version]-[platform]-[arch][ext]
          args: --target ${{ matrix.target }} ${{ matrix.bundle_args }} --features desktop
