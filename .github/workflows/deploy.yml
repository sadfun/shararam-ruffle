name: Deploy public server

# Builds the loopback companion in server-only mode, precompresses Ruffle's
# static assets, and ships both to the host behind Caddy. Runs on every push to
# main and can be triggered by hand for the first deploy or a rollback.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public
  cancel-in-progress: false

env:
  DEPLOY_HOST: 94.103.89.17
  DEPLOY_USER: shararam
  REMOTE_DIR: /opt/shararam
  BINARY: shararam-live-server

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli build-essential clang cmake libclang-dev pkg-config

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Configure libclang
        run: |
          llvm_config="$(command -v llvm-config || command -v llvm-config-18 || command -v llvm-config-14)"
          echo "LIBCLANG_PATH=$("$llvm_config" --libdir)" >> "$GITHUB_ENV"

      - name: Cache Cargo inputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: deploy-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build server binary
        run: |
          cargo build \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --release \
            --no-default-features
          test -x src-tauri/target/release/shararam-ruffle

      - name: Precompress Ruffle assets
        run: |
          STATIC_STAGE="${RUNNER_TEMP}/shararam-static"
          STATIC_ARCHIVE="${RUNNER_TEMP}/shararam-static.tar.gz"

          mkdir -p "$STATIC_STAGE"
          cp -a web/ruffle "$STATIC_STAGE/ruffle"

          find "$STATIC_STAGE/ruffle" -type f -size +1024c \
            ! -name '*.br' ! -name '*.gz' -print0 |
            while IFS= read -r -d '' asset; do
              brotli -q 11 -c "$asset" > "${asset}.br"
              gzip -9 -c "$asset" > "${asset}.gz"
              brotli -d -c "${asset}.br" | cmp -s "$asset" -
              gzip -d -c "${asset}.gz" | cmp -s "$asset" -
            done

          tar -C "$STATIC_STAGE" -czf "$STATIC_ARCHIVE" ruffle
          test -s "$STATIC_ARCHIVE"

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship and restart
        run: |
          BIN=src-tauri/target/release/shararam-ruffle
          STATIC_ARCHIVE="${RUNNER_TEMP}/shararam-static.tar.gz"
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes"
          SCP="scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          # Upload beside the live files, then swap only complete artifacts.
          $SCP "$BIN" "${TARGET}:${REMOTE_DIR}/${BINARY}.new"
          $SCP "$STATIC_ARCHIVE" "${TARGET}:${REMOTE_DIR}/static.tar.gz.new"
          $SSH "$TARGET" "
            set -e
            rm -rf /opt/shararam/public.new
            mkdir -p /opt/shararam/public.new
            tar -xzf /opt/shararam/static.tar.gz.new -C /opt/shararam/public.new
            test -n \"\$(find /opt/shararam/public.new/ruffle -maxdepth 1 -name '*.wasm.br' -print -quit)\"
            test -n \"\$(find /opt/shararam/public.new/ruffle -maxdepth 1 -name '*.wasm.gz' -print -quit)\"

            rm -rf /opt/shararam/public.old
            if [ -d /opt/shararam/public ]; then
              mv /opt/shararam/public /opt/shararam/public.old
            fi
            mv /opt/shararam/public.new /opt/shararam/public
            mv ${REMOTE_DIR}/${BINARY}.new ${REMOTE_DIR}/${BINARY}
            chmod 755 ${REMOTE_DIR}/${BINARY}
            sudo systemctl restart shararam
            sleep 2
            sudo systemctl is-active shararam
            rm -rf /opt/shararam/public.old
            rm -f /opt/shararam/static.tar.gz.new
          "

      - name: Verify the site is up
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://shararam.sadfun.dev/ || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "site did not return 200 after restart"
          exit 1

      - name: Verify precompressed Ruffle delivery
        run: |
          wasm_path=$(find web/ruffle -maxdepth 1 -name '*.wasm' -printf '/ruffle/%f\n' -quit)
          test -n "$wasm_path"

          headers=$(curl -fsSI \
            -H 'Accept-Encoding: br' \
            "https://shararam.sadfun.dev${wasm_path}" | tr -d '\r')
          grep -Fqx 'content-encoding: br' <<<"${headers,,}"
          grep -Fqx 'vary: accept-encoding' <<<"${headers,,}"
